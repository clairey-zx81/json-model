name: JMC Docs

on:
  push:
    branches:
      - main
      - post
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # for JSTS sources
          fetch-depth: 30
          fetch-tags: true
      - name: Install dependencies
        run: sudo apt install cloc make libpod-markdown-perl
      - name: Update docsify base path for github.io
        run: sed -i -e 's,https://json-model.org/,https://clairey-zx81.github.io/json-model/,' site/index.html
      - name: Build site
        run: make _site
      - name: Upload documentation artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        # with: path: _site
  deploy:
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
