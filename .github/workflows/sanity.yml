name: JMC Sanity Check

on:
  push:
    branches: [ main, dev, post ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        # NOTE google-re2 / bazel error on freethreaded true
        # freethreaded: true
    - name: Install Package Stuff
      run: make dev.py
    - name: Sanity Check
      run: make check.sanity
